<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dictate Overlay</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #141418;
        font-family: "Segoe UI", Arial, sans-serif;
        user-select: text;
        -webkit-app-region: drag;
      }
      .panel {
        height: 100%;
        background: #141418;
        color: #f3f2f1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
        -webkit-app-region: no-drag;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        background: rgba(0,0,0,.35);
        -webkit-app-region: drag;
        cursor: move;
        flex-shrink: 0;
        z-index: 2;
      }
      .title { font-weight: 600; font-size: 12px; flex-shrink: 0; }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        -webkit-app-region: no-drag;
      }
      .header-actions button {
        border: none;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      #transcript-btn {
        padding: 5px 10px;
        height: 28px;
        color: #f3f2f1;
        background: transparent;
        border: 1px solid rgba(255,255,255,.28) !important;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
      }
      #transcript-btn:hover {
        background: rgba(255,255,255,.1);
      }
      #send-btn {
        padding: 5px 14px;
        min-width: 56px;
        height: 28px;
        color: #fff;
        background: #2563eb;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
      }
      #send-btn:disabled {
        opacity: 0.65;
        cursor: default;
      }
      #send-btn:not(:disabled):hover {
        background: #1d4ed8;
      }
      #hide-btn {
        background: transparent;
        color: #fff;
        width: 24px;
        height: 24px;
        font-size: 16px;
        line-height: 1;
        border-radius: 4px;
      }
      #hide-btn:hover {
        background: rgba(255,255,255,.1);
      }
      .status {
        flex-shrink: 0;
        padding: 6px 12px;
        font-size: 11px;
        line-height: 1.35;
        color: #f3f2f1;
        background: rgba(37, 99, 235, 0.22);
        display: none;
        z-index: 2;
      }
      .status.visible { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .status.error {
        background: rgba(185, 28, 28, 0.35);
        color: #fecaca;
      }
      #status-text { flex: 1; min-width: 0; }
      #join-btn {
        flex-shrink: 0;
        display: none;
        padding: 4px 10px;
        height: 24px;
        color: #fff;
        background: #2563eb;
        border: none;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        -webkit-app-region: no-drag;
        white-space: nowrap;
      }
      .status.has-join #join-btn { display: inline-flex; align-items: center; }
      #join-btn:hover { background: #1d4ed8; }
      .chatgpt-host {
        flex: 1;
        min-height: 0;
        position: relative;
        background: #212121;
      }
      webview.chatgpt-frame {
        display: flex;
        width: 100%;
        height: 100%;
        border: none;
        background: #212121;
      }
      .chatgpt-loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        text-align: center;
        font-size: 13px;
        color: #a19f9d;
        background: #212121;
        z-index: 1;
        pointer-events: none;
      }
      .chatgpt-loading.hidden { display: none; }
      .badge {
        font-size: 10px;
        color: #6ee7b7;
        margin-left: 6px;
      }
      .meeting-id {
        font-size: 10px;
        font-weight: 600;
        color: #93c5fd;
        margin-left: 8px;
        letter-spacing: 0.02em;
        display: none;
      }
      .meeting-id.visible { display: inline; }
      .resize-handle {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 16px;
        height: 16px;
        cursor: nwse-resize;
        -webkit-app-region: no-drag;
        opacity: 0.45;
        z-index: 3;
      }
      .resize-handle::before {
        content: "";
        position: absolute;
        right: 4px;
        bottom: 4px;
        width: 8px;
        height: 8px;
        border-right: 2px solid rgba(255,255,255,.7);
        border-bottom: 2px solid rgba(255,255,255,.7);
      }
      .resize-handle:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="header">
        <span class="title">ChatGPT <span class="badge" id="stealth-badge">protected</span><span class="meeting-id" id="meeting-id"></span></span>
        <div class="header-actions">
          <button id="transcript-btn" type="button" title="Copy the full meeting transcript">Transcript</button>
          <button id="send-btn" type="button" title="Send saved unsent captions to ChatGPT">Send</button>
          <button id="hide-btn" type="button" title="Hide">×</button>
        </div>
      </div>
      <div class="status" id="status">
        <span id="status-text"></span>
        <button id="join-btn" type="button">Open Zoom in Chrome</button>
      </div>
      <div class="chatgpt-host">
        <div class="chatgpt-loading" id="chatgpt-loading">Loading ChatGPT…</div>
        <webview
          id="chatgpt-frame"
          class="chatgpt-frame"
          src="https://chatgpt.com"
          allowpopups
        ></webview>
      </div>
      <div class="resize-handle" id="resize-handle" title="Drag to resize"></div>
    </div>
    <script src="overlay.js"></script>
  </body>
</html>
